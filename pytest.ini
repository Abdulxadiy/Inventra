[pytest]
; Tell pytest-django which settings module to boot Django with when
; running tests. Points at config/settings_test.py (NOT config/settings.py)
; so tests always run against the isolated Postgres/Redis from
; docker-compose.test.yml, never against dev/production infrastructure.
DJANGO_SETTINGS_MODULE = config.settings_test

; Also collect tests from any leftover apps/<app>/tests.py single-file
; modules, in case not every app has been converted to a tests/ package yet.
python_files = tests.py test_*.py *_tests.py

; --reuse-db: keep the test database between runs instead of recreating
; it from migrations every time (much faster once you're iterating on a
; single test file repeatedly). If you change your models/migrations and
; the test DB schema gets out of sync, run `pytest --create-db` once to
; force a rebuild.
addopts = -ra --reuse-db

; Registers the "slow" marker used in test_otp_services.py so pytest
; doesn't warn about an "unknown mark" — doesn't change how the suite
; runs by default, just documents the marker's meaning. Deselect these
; explicitly with `pytest -m "not slow"` if you want a faster local loop.
markers =
    slow: test intentionally sleeps / is slower than the rest of the suite
